{% extends "base.html" %}

{% block title %}Rooms �?" MedSync{% endblock %}

{% block content %}
  <section class="page-header">
    <div>
      <h1 class="page-title">Rooms</h1>
      <p class="page-subtitle">Track room inventory and availability.</p>
    </div>
    <div class="page-actions">
      <button id="addRoom" class="btn-primary" type="button">
        <i class="fa-solid fa-hospital"></i>
        Add room
      </button>
      <button class="btn-ghost" type="button" onclick="window.location='{{ url_for('dashboard') }}'">
        <i class="fa-solid fa-chart-line"></i>
        Back to dashboard
      </button>
    </div>
  </section>

  <section class="panel">
    <header class="panel-header">
      <div>
        <h2 class="panel-title">All rooms</h2>
        <p class="panel-subtitle">Loaded from the room API.</p>
      </div>
    </header>

    <div class="table-responsive">
      <table id="datatable4">
        <thead>
          <tr>
            <th class="cell-id" style="width:30%">Room no.</th>
            <th style="width:30%">Type</th>
            <th class="cell-center" style="width:20%">Available</th>
            <th class="cell-actions" style="width:10%"></th>
            <th class="cell-actions" style="width:10%"></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <div id="room-modal-backdrop" class="modal-backdrop" style="display:none;">
    <div class="modal-panel">
      <header class="modal-header">
        <div class="modal-title">Room</div>
        <button type="button" id="close-modal-btn" class="btn-ghost">
          Close
        </button>
      </header>
      <div class="modal-body">
        <form id="detailform">
          <div class="field-group">
            <label class="field-label">Room number</label>
            <input class="field-input" name="room_no" type="text" required>
          </div>
          <div class="field-group">
            <label class="field-label">Type</label>
            <input class="field-input" name="room_type" type="text" required>
          </div>
          <div class="field-group">
            <label class="field-label">Available</label>
            <input class="field-input" name="available" type="text" placeholder="1 or 0 / yes or no" required>
          </div>
        </form>
      </div>
      <footer class="modal-footer">
        <button type="button" id="cancel-modal-btn" class="btn-ghost">Cancel</button>
        <button type="button" id="savetheroom" class="btn-primary">Save</button>
      </footer>
    </div>
  </div>
  <div id="myModal" style="display:none;"></div>
{% endblock %}

{% block head_extra %}{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='vendor/datatables/media/js/jquery.dataTables.min.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/datatables/media/js/dataTables.bootstrap.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/serialize/jquery.serializejson.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/sweetalert/dist/sweetalert.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/room.js') }}"></script>
  <script>
    $(function () {
      var $backdrop = $('#room-modal-backdrop');

      function openModal() {
        $backdrop.css('display', 'flex');
        $('body').css('overflow', 'hidden');
      }

      function closeModal() {
        $backdrop.css('display', 'none');
        $('body').css('overflow', '');
      }

      $('#close-modal-btn, #cancel-modal-btn').on('click', function () {
        closeModal();
      });

      $.fn.modal = function (action) {
        if (action === 'show' || action === undefined) {
          openModal();
          this.trigger('shown.bs.modal');
        } else if (action === 'hide') {
          closeModal();
          this.trigger('hidden.bs.modal');
        }
        return this;
      };
    });
  </script>
{% endblock %}
