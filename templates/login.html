<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - MedSync</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top, #ecfdf5, #eef2ff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-card {
      width: 100%;
      max-width: 380px;
      background-color: #ffffff;
      border-radius: 20px;
      padding: 24px 24px 20px;
      box-shadow: 0 14px 38px rgba(15, 23, 42, 0.25);
    }

    .auth-title {
      font-size: 22px;
      margin-bottom: 4px;
      color: #111827;
    }

    .auth-subtitle {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 18px;
    }

    .auth-field {
      margin-bottom: 14px;
    }

    .auth-label {
      display: block;
      font-size: 13px;
      color: #374151;
      margin-bottom: 4px;
    }

    .auth-input {
      width: 100%;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 13px;
    }

    .auth-input:focus {
      outline: none;
      border-color: #10b981;
      box-shadow: 0 0 0 1px #10b98133;
    }

    .auth-button {
      width: 100%;
      padding: 10px 14px;
      border-radius: 999px;
      border: none;
      background-color: #10b981;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }

    .auth-button:hover {
      background-color: #059669;
    }

    .auth-footer {
      margin-top: 14px;
      font-size: 13px;
      color: #6b7280;
      text-align: center;
    }

    .auth-footer a {
      color: #10b981;
      text-decoration: none;
      font-weight: 500;
    }

    .auth-error {
      margin-bottom: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      background-color: #fee2e2;
      color: #991b1b;
      font-size: 12px;
    }
  </style>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>
  <main class="auth-card">
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Log in to access the MedSync dashboard.</p>

    <div id="auth-error" class="auth-error" style="display:none;"></div>

    <form id="login-form">
      <div class="auth-field">
        <label class="auth-label" for="email">Email</label>
        <input id="email" name="email" type="email" class="auth-input" autocomplete="email" required>
      </div>
      <div class="auth-field">
        <label class="auth-label" for="password">Password</label>
        <input id="password" name="password" type="password" class="auth-input" autocomplete="current-password" required>
      </div>
      <button class="auth-button" type="submit">Log in</button>
    </form>

    <div class="auth-footer">
      No account yet?
      <a href="{{ url_for('signup_page') }}">Create one</a>
    </div>
  </main>

  <script>
    $(function () {
      $('#login-form').on('submit', function (e) {
        e.preventDefault();
        const email = $('#email').val().trim();
        const password = $('#password').val();

        $('#auth-error').hide().text('');

        $.ajax({
          url: '/auth/login',
          method: 'POST',
          contentType: 'application/json',
          data: JSON.stringify({ email, password })
        }).done(function () {
          window.location = '{{ url_for("dashboard") }}';
        }).fail(function (xhr) {
          const body = xhr.responseJSON || {};
          const msg = (body.errors && body.errors.join(' ')) || 'Unable to log in. Please check your details.';
          $('#auth-error').text(msg).show();
        });
      });
    });
  </script>
</body>

</html>
